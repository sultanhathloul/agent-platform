# The proof-of-concept knowledge base (phase 08, D4, ADR-0331): «الاقتصاد الدولي» / "International economy",
# read by analyst and evaluator (realm export). `make kb-poc` fetches each source below in development
# only, into build/kb-poc/ (never committed), uploads it with its source metadata (D3) through the
# gateway as the admin, and writes scripts/kb_poc/manifest.json (URL, retrieved date, SHA-256), which
# is committed instead of the content. Under smoke-airgap nothing fetches and nothing depends on it.
#
# A source with `url: null` is one the owner listed by site whose exact page is not yet written here;
# the run skips it and says so. HTML pages are kept as their visible text (Markdown), PDFs as they are.
