  slug: intl-economy
  name: {ar: "الاقتصاد الدولي", en: "International economy"}
  description:
    ar: "تقارير وأخبار عامة منشورة عن الاقتصاد الصيني والخليجي وأسواق الطاقة."
    en: "Public reports and news on the Chinese and Gulf economies and energy markets."
