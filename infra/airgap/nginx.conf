# The airgap stack's only ingress (F2): a TCP relay from the host's published ports to the
# services on the internal network. Fixed destinations; no other upstream is reachable.
worker_processes 1;
events {
    worker_connections 1024;
}
stream {
    server { listen 3000; proxy_pass web:3000; }
    # The gateway refuses an over-limit upload before reading its body and closes (finding 2,
    # ADR-0271): each direction is closed on its own, so its JSON answer and the close reach the
    # client in order, never cut by a reset for the body bytes the gateway never read.
    server { listen 8080; proxy_pass gateway:8080; proxy_half_close on; }
    server { listen 8081; proxy_pass keycloak:8080; }
    server { listen 3001; proxy_pass langfuse-web:3000; }
}
