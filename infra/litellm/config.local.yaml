# Offline profile (ADR-0065): the tier aliases on local Ollama, as config.yaml
# had them before the dev tiers moved to OpenRouter. Same aliases, so nothing
# else changes. Run the stack and the smoke test on it once per phase before
# merge (docs/HANDOFF.md, owner checklist):
#
#   ollama pull qwen2.5:3b && ollama pull qwen2.5:14b-instruct && ollama pull gemma4:31b && ollama pull bge-m3
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml make up smoke
#   make up        # back to config.yaml (OpenRouter)
#
# num_ctx is the dev host limit and is below the tier windows in
# config/models.yaml, which follow the OpenRouter models. Ollama silently
# truncates a prompt longer than num_ctx; the smoke prompts are far shorter.
model_list:
  - model_name: fast
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 32768
  - model_name: standard
    litellm_params:
      model: ollama_chat/qwen2.5:14b-instruct
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 32768
  - model_name: heavy
    litellm_params:
      model: ollama_chat/gemma4:31b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 65536
  - model_name: embed
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      mode: embedding
  # rerank (bge-reranker-v2-m3) is added in phase 04; Ollama cannot serve it (ADR-0008).

router_settings:
  # Only downward fallback that keeps the risk floor (never below standard).
  fallbacks:
    - heavy: [standard]

litellm_settings:
  drop_params: true
  request_timeout: 300
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
