# Test-only LiteLLM config (ADR-0007). Same aliases as config.yaml, every one
# answering with mock_response, so `make test` exercises the real client path
# (Context Assembly → models.call → LiteLLM) without reaching a model.
model_list:
  # The helper roles (summarizer, extractor) run on `fast`. Its answer is a valid
  # memory extraction, so the memory write path stores an item in tests (ADR-0058);
  # as a summary it is simply a non-empty text.
  - model_name: fast
    litellm_params:
      model: openai/mock-fast
      api_key: mock
      mock_response: '[{"kind": "preference", "text": "يفضّل المستخدم الإجابات المختصرة.", "confidence": 0.9}]'
  - model_name: standard
    litellm_params:
      model: openai/mock-standard
      api_key: mock
      mock_response: "هذه إجابة تجريبية من النموذج الوهمي. This is a mock answer."
  - model_name: heavy
    litellm_params:
      model: openai/mock-heavy
      api_key: mock
      mock_response: "هذه إجابة تجريبية من النموذج الوهمي. This is a mock answer."
  # A deterministic test service (ADR-0143): a hashed bag of normalized words, so texts
  # sharing more words are more similar, identically on every run.
  - model_name: embed
    litellm_params:
      model: openai/hashed-words
      api_base: http://embed-mock:8000/v1
      api_key: mock
    model_info:
      mode: embedding
  # One fixed vector for every text: every item is maximally similar to every query. Only for
  # tests that need identical similarity (memory isolation), which name this alias (ADR-0143).
  - model_name: embed-fixed
    litellm_params:
      model: openai/mock-embed
      api_key: mock
      mock_response: [0.12, 0.34, 0.56, 0.78]
    model_info:
      mode: embedding
  # Rerank by word overlap with the query, through the same Infinity provider as the real
  # stack (ADR-0134, ADR-0143).
  - model_name: rerank
    litellm_params:
      model: infinity/word-overlap
      api_base: http://embed-mock:8000
      api_key: mock
    model_info:
      mode: rerank

  # A slow model provider (timeout budget PR, I2 and I4; ADR-0255, ADR-0257): tests run it in the
  # test container (tests/fixtures/slow_upstream.py, port 8765; `make test-agent` uses
  # --use-aliases so the container answers to agent-tests). Test-only aliases; no tier names them.
  - model_name: slow-hung
    litellm_params: {model: openai/hung, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-trickle
    litellm_params: {model: openai/trickle, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-flood
    litellm_params: {model: openai/flood, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-ok
    litellm_params: {model: openai/ok, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-drop
    litellm_params: {model: openai/drop, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-429
    litellm_params: {model: openai/status429, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-500
    litellm_params: {model: openai/status500, api_base: "http://agent-tests:8765/v1", api_key: mock}
  # As heavy → standard in config.yaml: a fallback hop, here from one hung upstream to another.
  - model_name: slow-fallback
    litellm_params: {model: openai/hung, api_base: "http://agent-tests:8765/v1", api_key: mock}
  - model_name: slow-embed-hung
    litellm_params: {model: openai/hung, api_base: "http://agent-tests:8765/v1", api_key: mock}
    model_info:
      mode: embedding
  - model_name: slow-embed-trickle
    litellm_params: {model: openai/trickle, api_base: "http://agent-tests:8765/v1", api_key: mock}
    model_info:
      mode: embedding
  - model_name: slow-embed-flood
    litellm_params: {model: openai/flood, api_base: "http://agent-tests:8765/v1", api_key: mock}
    model_info:
      mode: embedding
  - model_name: slow-embed-ok
    litellm_params: {model: openai/ok, api_base: "http://agent-tests:8765/v1", api_key: mock}
    model_info:
      mode: embedding
  - model_name: slow-rerank-hung
    litellm_params: {model: infinity/hung, api_base: "http://agent-tests:8765", api_key: mock}
    model_info:
      mode: rerank
  - model_name: slow-rerank-trickle
    litellm_params: {model: infinity/trickle, api_base: "http://agent-tests:8765", api_key: mock}
    model_info:
      mode: rerank
  - model_name: slow-rerank-flood
    litellm_params: {model: infinity/flood, api_base: "http://agent-tests:8765", api_key: mock}
    model_info:
      mode: rerank
  - model_name: slow-rerank-ok
    litellm_params: {model: infinity/ok, api_base: "http://agent-tests:8765", api_key: mock}
    model_info:
      mode: rerank

router_settings:
  fallbacks:
    - slow-fallback: [slow-hung]

# As config.yaml (I4): the agent retries, LiteLLM does not; its own bound is past the agent's.
litellm_settings:
  num_retries: 0
  request_timeout: 85

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
