# Tier aliases → concrete endpoints (README §19.1, ADR-0008).
# This file is the only place in the repository that names a model.
# Dev tiers run on OpenRouter with open-weight models that mirror what
# production can host; embed stays on local Ollama. The offline profile is
# config.local.yaml. No real or ministry data in dev while on OpenRouter.
model_list:
  - model_name: fast
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          allow_fallbacks: false
  - model_name: standard
    litellm_params:
      model: openrouter/qwen/qwen3.6-27b
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          allow_fallbacks: false
  - model_name: heavy
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          allow_fallbacks: false
  - model_name: embed
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      mode: embedding
  # rerank (bge-reranker-v2-m3) is added in phase 04; Ollama cannot serve it (ADR-0008).

router_settings:
  # Only downward fallback that keeps the risk floor (never below standard).
  fallbacks:
    - heavy: [standard]

litellm_settings:
  drop_params: true
  request_timeout: 300
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY