spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    hikari:
      maximum-pool-size: 10
  # The multipart caps come from config/docs.yaml (AttachmentsConfig, owner decision R3): no upload
  # limit is written here.
  flyway:
    schemas: gateway
    default-schema: gateway
    create-schemas: true

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # Connections the gateway holds at once, written here so the value is reviewed rather than
    # inherited (Tomcat's own default, 8192). With virtual threads a connection, not a thread, is
    # the shared resource; uploads can hold at most limits.max_concurrent_uploads_total of them
    # (config/docs.yaml, 50), so chat and every other request keep the rest (the verification of
    # review round 2). Past this, new connections wait in the accept queue.
    max-connections: 8192
    accept-count: 100
    # A refused upload's body is never drained (review round 2, finding 2): the gateway swallows
    # none of it (0), so Tomcat closes the connection as soon as the refusal is written instead of
    # reading a body it already refused. A trickled or huge-declared upload therefore cannot hold a
    # connection — or its request-processing thread — open. The gate also sets Connection: close.
    max-swallow-size: 0
    # While a request body IS being read (an accepted upload), cut it if it stalls this long. The
    # whole body must also arrive within limits.upload_deadline_seconds (config/docs.yaml).
    connection-upload-timeout: 30s
    disable-upload-timeout: false
  compression:
    enabled: false

# Every value can be overridden by env (GATEWAY_KEYCLOAK_ISSUER, GATEWAY_AGENT_BASE_URL, ...).
gateway:
  keycloak:
    issuer: http://localhost:8081/realms/agent
    jwks-uri: http://localhost:8081/realms/agent/protocol/openid-connect/certs
    audience: gateway
    # Admin REST API with the service account of the `gateway` client (policy roles, ADR-0107);
    # GATEWAY_KEYCLOAK_ADMIN_* in compose.
    admin:
      base-url: http://localhost:8081
      realm: agent
      client-id: gateway
      client-secret: ""
  agent:
    base-url: http://localhost:8000
    # internal-token has no default: the gateway refuses to start without it.
    connect-timeout: 5s
    # Every agent call but a turn stream, from the request to the body's end: Spring's JDK client
    # applies it to the whole exchange, body included (finding of the timeout budget PR, ADR-0256).
    # A turn stream is bounded by config/turn.yaml instead (gateway.turn).
    response-timeout: 60s
    # An idle connection to the agent is dropped after this, before the agent's server drops it
    # (uvicorn --timeout-keep-alive 75, services/agent/Dockerfile): I8, ADR-0260. JDK 21's own
    # default is the same 30 s; it is set here so it is reviewed rather than inherited.
    keep-alive: 30s
  cors:
    allowed-origins: http://localhost:3000
  models:
    # Role tier caps (ADR-0046); compose mounts the file and sets GATEWAY_MODELS_CONFIG.
    config: ../../config/models.yaml
  docs:
    # Upload limits (ADR-0126); compose mounts config/docs.yaml and sets GATEWAY_DOCS_CONFIG.
    config: ../../config/docs.yaml
  turn:
    # The relay's bound on a turn stream, deadline_s + gateway_margin_s (I3, ADR-0256); compose
    # mounts config/turn.yaml and sets GATEWAY_TURN_CONFIG.
    config: ../../config/turn.yaml
  storage:
    # MinIO on the compose network (ADR-0129); GATEWAY_STORAGE_* in compose.
    endpoint: http://localhost:9000
    access-key: ""
    secret-key: ""
    bucket: uploads

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      "[spring.security]": false
  # management.otlp.tracing.endpoint comes from MANAGEMENT_OTLP_TRACING_ENDPOINT;
  # without it no exporter is created.

springdoc:
  paths-to-match: /v1/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [request_id=%X{request_id:-}]"
