spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    hikari:
      maximum-pool-size: 10
  flyway:
    schemas: gateway
    default-schema: gateway
    create-schemas: true

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: false

# Every value can be overridden by env (GATEWAY_KEYCLOAK_ISSUER, GATEWAY_AGENT_BASE_URL, ...).
gateway:
  keycloak:
    issuer: http://localhost:8081/realms/agent
    jwks-uri: http://localhost:8081/realms/agent/protocol/openid-connect/certs
    audience: gateway
  agent:
    base-url: http://localhost:8000
    # internal-token has no default: the gateway refuses to start without it.
    connect-timeout: 5s
    response-timeout: 60s
  cors:
    allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      "[spring.security]": false
  # management.otlp.tracing.endpoint comes from MANAGEMENT_OTLP_TRACING_ENDPOINT;
  # without it no exporter is created.

springdoc:
  paths-to-match: /v1/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [request_id=%X{request_id:-}]"
