# The reference routing capability (phase 05, I14, ADR-0215): declarative (I12, ADR-0213), so it is
# this manifest, its prompts and its evals, and no Python. It reaches the routing MCP server of
# config/mcp.yaml through the broker only (D3), with the two tools it declares.
slug: directions
version: 1.0.0
name: {ar: "الاتجاهات والمسارات", en: "Directions and routes"}
description:
  ar: "المسافة ومدة الوصول وأهم خطوات الطريق بين مكانين في الرياض، بالسيارة أو مشيًا."
  en: "Distance, travel time and the main steps of the route between two places in Riyadh, by car or on foot."
icon: "map"
enabled_by_default: true
permission: "cap:directions"
risk: read
ui:
  mode: auto                       # chosen by the router model, never toggled
  order: 30
routing_hints:
  description:
    ar: "طلبات الطريق أو المسار أو المسافة أو مدة الوصول من مكان إلى آخر داخل الرياض، بالسيارة أو مشيًا."
    en: "Requests for the way, route, distance or travel time from one place to another in Riyadh, by car or on foot."
  keywords:
    ar: ["طريق", "مسار", "ودّني", "ودني", "وصّلني", "وصلني", "كم يبعد", "المسافة", "أقرب طريق", "كيف أروح", "كيف اروح"]
    en: ["directions", "route", "how far"]
  rules:
    - when: keyword_candidate      # a keyword makes it a router candidate, never selects it (I15)
model:
  min_tier: standard
  steps: {}
  on_overflow: compress
context:
  # The window for a follow-up ("وكم تستغرق مشيًا؟") and the findings it produces, which the answer
  # synthesizes from (ADR-0161): I14's [window], with the block that carries its result (ADR-0220).
  needs: [window, findings]
  max_input_tokens: 4000
documents:
  collections: []                  # reads no document (I1)
tools: [routing.geocode, routing.route]
limits:
  max_iterations: 1
  timeout_s: 45
state_namespace: "cap.directions"
declarative:
  extract:
    role: extractor
    prompt: directions.extract
    on_missing: ask
    schema:
      type: object
      additionalProperties: false
      properties:
        origin: {type: [string, "null"], maxLength: 200}
        destination: {type: [string, "null"], maxLength: 200}
        profile: {type: [string, "null"], enum: [car, foot, null]}
      required: [origin, destination]
  steps:
    - {id: from, tool: routing.geocode, args: {query: $.extract.origin}}
    - {id: to, tool: routing.geocode, args: {query: $.extract.destination}}
    - id: route
      tool: routing.route
      args: {from: $.steps.from.result.best.id, to: $.steps.to.result.best.id, profile: $.extract.profile}
  findings:
    prompt: directions.findings
