# The kb suite's knowledge bases (phase 08, I6): created by the eval harness as the admin, their
# documents uploaded with their source metadata (D3) and indexed before the cases run. Fake data only
# (ADR-0065): «الواحة» and every figure are invented (evals/docs/generate_kb.py). The eval user
# `evaluator` holds both roles in the realm export.
knowledge_bases:
