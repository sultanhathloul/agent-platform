      - key: april
        file: kb/outlook-april-2031.pdf
        metadata: {title: "آفاق اقتصاد الواحة - أبريل 2031", publisher: "صندوق الواحة للنقد", published_on: "2031-04-15",
                   source_url: "https://example.org/oasis/outlook-2031-04"}
      - key: july
        file: kb/outlook-july-2031.pdf
        metadata: {title: "آفاق اقتصاد الواحة - يوليو 2031", publisher: "صندوق الواحة للنقد", published_on: "2031-07-20",
                   source_url: "https://example.org/oasis/outlook-2031-07", supersedes: april}
