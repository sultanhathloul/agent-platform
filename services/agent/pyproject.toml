[project]
name = "agent"
version = "0.1.0"
description = "Sovereign Agent Platform: agent service (LangGraph, internal API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tiktoken>=0.8",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.5",
    "redis>=5.2",
    "pypdf>=5.4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "minio>=7.2",
    "defusedxml>=0.7.1",
    "mcp==1.30.0",
    "anyio>=4.4",
]

[dependency-groups]
dev = [
    "arabic-reshaper>=3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-bidi==0.6.6",
    "reportlab>=4.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app/capabilities"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: goes through LiteLLM (mock aliases) and needs LITELLM_BASE_URL",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
