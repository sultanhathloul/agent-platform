# Test-only declarative capability (phase 05, E1, ADR-0213): a manifest and prompts, no Python. It
# chains the probe's tool twice, the second call fed by the first one's result, so the runner's
# mapping, order, stops and findings are tested without any MCP server. No core file names it.
slug: waypoint
version: 1.0.0
name: {ar: "نقطة الاختبار", en: "Test waypoint"}
description:
  ar: "قدرة اختبار تصريحية."
  en: "Declarative test capability."
icon: "flask"
enabled_by_default: true
permission: "cap:waypoint"
risk: read
ui:
  mode: auto
  order: 60
routing_hints:
  description:
    ar: "رسائل الاختبار التي تذكر نقطة الاختبار."
    en: "Test messages that mention the waypoint."
  keywords: {ar: ["نقطة-اختبار"], en: ["waypoint-capability"]}
  rules:
    - when: keyword
model:
  min_tier: standard
  steps: {}
  on_overflow: compress
context:
  needs: [findings]
  max_input_tokens: 4000
tools: [probe_lookup]
limits:
  max_iterations: 1
  timeout_s: 20
state_namespace: "cap.waypoint"
declarative:
  extract:
    role: extractor
    prompt: waypoint.extract
    schema:
      type: object
      additionalProperties: false
      properties:
        place: {type: [string, "null"]}
        note: {type: [string, "null"]}
      required: [place]
  steps:
    - {id: first, tool: probe_lookup, args: {text: $.extract.place}}
    - {id: second, tool: probe_lookup, args: {text: $.steps.first.result.text}}
  findings:
    prompt: waypoint.findings
