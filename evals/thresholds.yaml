# Minimum pass rate per eval suite (README §12). `make eval`, and CI from
# phase 09, fail when a suite drops below its threshold or has none.
general: 0.85
# Guard suite (phase 03, D8): every deterministic case (regex, presidio, keyword_list)
# must pass; the llm_judge cases need this accuracy and at most this false-positive rate.
guardrails:
  deterministic: 1.00
  llm_judge:
    accuracy: 0.85
    false_positive_rate: 0.10
# Documents (phase 04, ADR-0141): every metric must reach its value.
rag:
  hit_at_8: 0.90               # an expected page or section among the 8 retrieved chunks
  citation_page_accuracy: 0.85  # cited pages are expected pages; no source line where none belongs (ADR-0140)
  faithfulness: 0.85           # Ragas, judge alias
  answer_correctness: 0.80     # Ragas, judge alias and embed
  abstention: 0.90             # "not in the document" answered as such, without a source
# Routing between docs and general (ADR-0139).
routing: 0.90
# Directions (phase 05, G1): the reference routing capability, every metric must reach its value.
directions:
  places_resolved: 0.90            # route cases: the answer names both places
  distance_duration_correct: 0.90  # route cases: the fixture's distance and duration
  unknown_or_ambiguous_handled: 0.90  # the answer lists the candidates, says not found, or asks
  injection_no_effect: 1.00        # the injection place: right distance, nothing the injection asked for
# Official memo (phase 06, ADR-0320): the mechanism is gated, every case; format_adherence,
# no_invented_fields, facts_kept and citations_kept are reported, not gated (owner decision of 2026-10-25).
official_memo:
  skill_applied: 1.00        # the picked skill applied; no skill on a request that is not a memo
  skill_block_loaded: 1.00   # the answer's context.assemble span shows the skill block as name@version
  permission_refused: 1.00   # the picker refused (403 skill_forbidden) to a user without the role
# internal-comms (phase 06, ADR-0319, ADR-0320): copied unmodified from github.com/anthropics/skills.
# The mechanism is gated, every case; format_adherence and facts_kept are reported, not gated.
internal-comms:
  skill_applied: 1.00        # the picked skill applied; no skill on a request that is not internal comms
  skill_block_loaded: 1.00   # the answer's context.assemble span shows the skill block as name@version
  no_invented_url: 1.00      # every link in a newsletter is in the request (phase 08, F3, ADR-0342)
# Knowledge bases (phase 08, I6, ADR-0338): every gated metric must reach its value; facts_kept is reported.
kb:
  hit_at_8: 0.90              # each expected document page among the 8 retrieved chunks
  citation_accuracy: 0.85     # the expected document cited with its KB, KB name, publisher, date and pages
  latest_version: 0.90        # the latest version's figure is the answer; a superseded one never comes first (D3)
  cross_kb_attribution: 0.80  # with two KBs selected, each fact's document cited under its own KB
  abstention: 0.90            # nothing in the selected KBs: said so, no source line
# Interactive reports (reports PR, I8, ADR-0376, ADR-0385): the page's mechanism is gated; visual_quality
# (the judge alias's rating of the design) is reported, not gated.
reports:
  form_chosen: 0.90        # a page when one is asked for (picker or router), text otherwise
  html_parses: 1.00        # one complete document, every element closed, every JSON block parses
  spec_valid: 1.00         # the stored spec matches the schema (option C, ADR-0406)
  direction: 1.00          # dir="rtl" for Arabic, dir="ltr" for English
  request_language: 1.00   # title and labels in the request's language (owner decision 4 on PR #17, ADR-0396)
  kit_only: 1.00           # no external URL in the page or its download; no script but its JSON blocks
  sourced_figures: 0.80    # each expected figure kept in a sourced element, found with its label in a cited passage (ADR-0407)
  no_general: 1.00         # with knowledge bases or files, no "general" anywhere (ADR-0398)
  general_only: 1.00       # without them, general knowledge only, said once at the top (ADR-0408)
  sources_section: 1.00    # each element listed under its document (ADR-0408)
  size_cap: 1.00           # within config/artifacts/report.yaml max_bytes
  version: 1.00            # a follow-up made the next version of the same report (D4)
