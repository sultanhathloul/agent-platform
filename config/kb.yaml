# Knowledge bases (UC4, README §9.4; phase 08, ADR-0333 to ADR-0339): the kb capability's own
# configuration. Retrieval itself (hybrid, fusion, rerank, the version preference) is the shared
# library's, in config/docs.yaml `retrieval`.

# The DocumentBackend KB documents are registered with and searched on (I2, ADR-0334): `internal` is
# the phase 04 pipeline; `mcp` is the RAG server of config/docs.yaml `mcp_server`. KB_BACKEND in
# .env overrides it per environment (ADR-0224). Switching it affects new uploads only.
backend: internal

retrieval:
  top_k: 8                     # passages for the answer, across the selected knowledge bases (I4)
  # A report turn builds every figure from the passages (ADR-0401, ADR-0403): the general search takes
  # report_top_k, each planned chart or table report_section_k, and the turn keeps at most
  # report_max_passages with the passages an edit re-fetches (ADR-0402). kb_search allows 20 per call.
  report_top_k: 12
  report_section_k: 4
  report_max_passages: 40
