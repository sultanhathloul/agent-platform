# Tiers, roles, escalation and caps (README §19.1). Aliases resolve to concrete
# models in infra/litellm/config.yaml. Code names roles and steps, never models.
# `window` and `max_output` are platform budgets (README §19.1), not provider limits:
# the budget guard assembles within `window`, and a call asks for at most
# `max_output` tokens. Every alias must accept them; infra/litellm/config.yaml sets
# Ollama's num_ctx to the same windows (ADR-0067).
tiers:
  fast:     {alias: fast,     window: 32768, max_output: 2000, cost_weight: 1}
  standard: {alias: standard, window: 32768, max_output: 4000, cost_weight: 5}
  heavy:    {alias: heavy,    window: 65536, max_output: 8000, cost_weight: 20}

# Lowest to highest; "one tier up" follows this order.
order: [fast, standard, heavy]

roles:                      # helper roles are pinned to fast
  router:     fast
  summarizer: fast
  judge:      fast          # online eval + llm_judge guard checker
  extractor:  fast          # memory candidate extraction, context compression
  reflection: standard
  reasoning:  standard      # provisional; capability floors and escalation apply (§19.3)

# Decoding temperature per role (ADR-0032). Every role in `roles` needs one, and
# startup fails without it. Helper roles decode greedily so their output is
# comparable between runs; the answer keeps a little sampling.
temperature:
  router:     0.0
  summarizer: 0.0
  judge:      0.0
  extractor:  0.0
  reflection: 0.2
  reasoning:  0.2

escalation:
  complexity_high: heavy
  risk_high: standard
  context_overflow_default: compress   # compress | escalate; a capability manifest may override
  on_validation_failure: "+1"  # one tier up, once
  max_escalations_per_turn: 2

caps:                        # ceilings; also expressible as MODEL_TIER guard policies
  default: heavy             # applied by the agent when the principal carries no max_tier
  role:viewer: standard      # role entries are read by the gateway, which sends principal.max_tier (ADR-0046)

embedding:
  alias: embed

# Cross-encoder reranking of retrieved chunks (README §9.3, ADR-0134); served by the
# `rerank` alias in infra/litellm/config.yaml.
rerank:
  alias: rerank

# Bounds on model calls (timeout budget PR, I4, ADR-0257). Each is a wall-clock deadline from send
# to the last chunk, cut to what remains of the call around it (the turn, a capability, a tool):
# an inner bound is never past its outer one. The OpenAI and httpx per-operation timeouts sit 1 s
# above it and LiteLLM's per-request timeout 1 s below it, so the agent's deadline decides.
timeouts:
  roles:                    # every role in `roles`
    router:     20
    summarizer: 20
    judge:      20
    extractor:  20
    reasoning:  90
    reflection: 90
  embedding:
    query:  15              # a question or memory item matched at answer time
    ingest: 60              # one batch of document chunks (ingest.embed_batch) at ingestion
  rerank: 20
  # The agent's retry (LiteLLM retries none): at most one, only before the first streamed token,
  # only on 429, 5xx or a connection error, and only when at least min_remaining_s remain.
  retry:
    min_remaining_s: 10
    backoff_s: [0.5, 1.5]   # uniform between the two
