# Owner decision (ADR-0107): visibility by role through a policy role. A user who holds the
# realm role `policy:no-sql` does not see the sql capability, whatever cap:* roles they hold;
# authorization itself stays cap:{slug} in the gateway (ADR-0006). Disabled by default.
id: tool-visibility-by-role
name: Hide the sql capability from the policy role no-sql
description: >-
  TOOL_LIST removes the sql capability for users holding the realm role policy:no-sql.
  The role grants nothing; it only selects this policy.
enabled: false
scope: role:no-sql
checkpoints: [TOOL_LIST]
checker: keyword_list
config:
  keywords: [sql]
action: block
severity: medium
message_ar: "هذه القدرة غير متاحة لك."
message_en: "This capability is not available to you."
