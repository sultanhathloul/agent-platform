# Seeded once into agent.guard_policies; after that the admin UI owns it (I2).
id: pii-redact-output
name_ar: إخفاء البيانات الشخصية في الإجابات والملخصات
name_en: Redact personal data in answers and summaries
description_ar: >-
  تُستبدل أرقام الجوال السعودية وأرقام الهوية الوطنية والإقامة وأرقام الآيبان السعودية وعناوين
  البريد الإلكتروني بوسم إخفاء يذكر نوعها، قبل أن تغادر الإجابة الوكيل (جملةً جملةً أثناء البث)،
  وقبل حفظ الملخص المتجدد. يُعدّ الرقم المكوّن من عشرة أرقام هويةً حين يصحّ رقم التحقق فيه، أو
  حين تسبقه كلمة دالة مثل الهوية أو السجل المدني أو الإقامة.
description_en: >-
  Saudi mobile numbers, national ID and iqama numbers, SA IBANs and email addresses are
  replaced with [REDACTED:<type>] before an answer leaves the agent (sentence by sentence
  while it streams) and before the rolling summary is stored. A ten-digit number counts as
  an ID when its check digit is valid or a context word (ID, iqama, هوية, سجل مدني, إقامة)
  stands within five tokens before it.
enabled: true
scope: global
checkpoints: [DATA]
checker: presidio
config:
  entities: [SA_MOBILE, SA_NATIONAL_ID, SA_IBAN, EMAIL_ADDRESS]
  score_threshold: 0.5
  targets: [answer, summary]
action: redact
severity: high
group: pii-output
