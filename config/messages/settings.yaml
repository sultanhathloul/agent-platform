  docs.tenant_concurrent_uploads: {ar: "حدود رفع خاصة لبعض الجهات", en: "Upload limits for specific tenants"}
  docs.uploads_per_minute: {ar: "عمليات الرفع في الدقيقة للمستخدم الواحد", en: "Uploads per minute per user"}
  docs.register_response_s: {ar: "مهلة الرد على رفع الملف", en: "Time an upload waits for its answer"}
  mcp.max_concurrency: {ar: "الطلبات المتزامنة على خادم الأدوات", en: "Concurrent requests to the tool server"}
