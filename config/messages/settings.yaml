  turn.post_answer_reserve_s: {ar: "الوقت المحجوز بعد الإجابة", en: "Time kept after the answer"}
  turn.evidence_fetch_s: {ar: "مهلة جلب نصوص المصادر", en: "Time to fetch the sources' text"}
  turn.report_deadline_s: {ar: "مهلة سؤال التقرير التفاعلي كله", en: "Whole interactive-report question time limit"}
  turn.report_answer_s: {ar: "سقف كتابة التقرير التفاعلي", en: "Interactive report writing ceiling"}
  models.helper_s: {ar: "مهلة النماذج المساعدة", en: "Helper models' time limit"}
  models.reasoning_s: {ar: "مهلة نموذج الإجابة", en: "Answering model's time limit"}
  models.report_writer_s: {ar: "مهلة نموذج كتابة التقارير", en: "Report-writing model's time limit"}
  models.embed_query_s: {ar: "مهلة تحويل السؤال إلى تمثيل رقمي", en: "Time to embed a question"}
  models.embed_batch_s: {ar: "مهلة تحويل دفعة من مقاطع الملفات", en: "Time to embed a batch of file passages"}
