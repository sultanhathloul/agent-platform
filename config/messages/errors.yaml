# Fallback texts for error codes the agent streams in `error` events.
# The web app renders its own i18n strings by code; these serve API consumers.
unauthorized:
  ar: "الطلب الداخلي غير مصرح به."
  en: "The internal request is not authorized."
invalid_request:
  ar: "الطلب غير صالح."
  en: "The request is invalid."
no_capability_available:
  ar: "لا تتوفر لك أي قدرة لمعالجة هذا الطلب."
  en: "No capability is available to handle this request."
context_overflow:
  ar: "الطلب أطول من أن تتسع له ذاكرة النموذج."
  en: "The request does not fit in the model context."
model_unavailable:
  ar: "خدمة النموذج غير متاحة حاليًا. حاول مرة أخرى لاحقًا."
  en: "The model service is unavailable. Please try again later."
validation_failed:
  ar: "لم تجتز الإجابة التحقق، فلم تُعرض."
  en: "The answer failed validation and was not shown."
turn_failed:
  ar: "تعذّر إكمال الطلب."
  en: "The request could not be completed."
capability_failed:
  ar: "تعذّر إكمال إحدى القدرات المطلوبة، فلم تكتمل الإجابة."
  en: "A capability could not complete, so the answer was not produced."
output_blocked:
  ar: "حُجبت الإجابة بموجب سياسة المحتوى."
  en: "The answer was withheld by a content policy."
data_blocked:
  ar: "حُجبت الإجابة لأنها تتضمن بيانات محمية."
  en: "The answer was withheld because it contains protected data."
conversation_forbidden:
  ar: "هذه المحادثة تخص مستخدمًا آخر، فلا يمكنك متابعتها."
  en: "This conversation belongs to another user, so you cannot continue it."
turn_not_found:
  ar: "لم يُعثر على هذه الإجابة في المحادثة."
  en: "This reply was not found in the conversation."
not_found:
  ar: "المورد المطلوب غير موجود."
  en: "The requested resource does not exist."
memory_not_found:
  ar: "لم يُعثر على هذا العنصر في ذاكرتك."
  en: "This item was not found in your memory."
turn_in_flight:
  ar: "ما زال طلب سابق في هذه المحادثة قيد المعالجة. انتظر حتى يكتمل ثم أعد المحاولة."
  en: "An earlier request in this conversation is still being processed. Wait for it to finish, then try again."
service_busy:
  ar: "الخدمة مشغولة الآن بطلبات أخرى. أعد المحاولة بعد لحظات."
  en: "The service is busy with other requests right now. Try again in a moment."
input_blocked:
  ar: "لم يُنفَّذ الطلب بموجب سياسة المحتوى."
  en: "The request was not carried out under a content policy."
guard_unavailable:
  ar: "تعذّر التحقق من سياسات الحماية الآن، فلم يكتمل الطلب. حاول مرة أخرى لاحقًا."
  en: "The protection policies could not be checked right now, so the request was not completed. Try again later."
policy_not_found:
  ar: "لم يُعثر على هذه السياسة."
  en: "This policy was not found."
policy_exists:
  ar: "توجد سياسة بهذا المعرّف بالفعل."
  en: "A policy with this id already exists."
policy_invalid:
  ar: "السياسة غير صالحة."
  en: "The policy is invalid."
# Attachments (phase 04, ADR-0126, ADR-0129).
attachment_not_found:
  ar: "لم يُعثر على هذا الملف في المحادثة."
  en: "This file was not found in the conversation."
attachment_limit:
  ar: "بلغت المحادثة الحد الأقصى لعدد الملفات المرفقة."
  en: "The conversation already holds the maximum number of files."
file_type_unsupported:
  ar: "نوع الملف غير مدعوم. الأنواع المدعومة: مستندات بي دي إف، ومستندات وورد، وجداول إكسل، والنصوص، وملفات ماركداون."
  en: "This file type is not supported. Supported types: PDF, Word, Excel, text and Markdown."
file_too_large:
  ar: "حجم الملف أكبر من الحد المسموح به."
  en: "The file is larger than the allowed size."
too_many_pages:
  ar: "عدد صفحات الملف أكبر من الحد المسموح به."
  en: "The file has more pages than allowed."
storage_unavailable:
  ar: "تعذّر الوصول إلى مخزن الملفات. حاول مرة أخرى لاحقًا."
  en: "The file storage is unavailable. Please try again later."
