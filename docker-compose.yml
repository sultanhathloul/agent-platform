# v1 stack (README §14). Every value comes from .env (`make env`); no secrets here.
name: agent-platform

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

x-langfuse-env: &langfuse-env
  # Next.js binds to $HOSTNAME, which Docker sets to the container id.
  HOSTNAME: "0.0.0.0"
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  # Its own MinIO user, limited to the langfuse bucket (owner decision S7).
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_LANGFUSE_ACCESS_KEY:?run scripts/init_env.sh or see .env.example}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_LANGFUSE_SECRET_KEY:?see .env.example}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  REDIS_TLS_ENABLED: "false"

x-agent-env: &agent-env
  LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
  AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
  CONFIG_DIR: /srv/config
  # Skills (phase 06, ADR-0295): skills/<slug>/ at the repository root, mounted read-only.
  SKILLS_DIR: /srv/skills
  USER_ID_HASH_SALT: ${USER_ID_HASH_SALT}
  # HMAC key of the content hashes in traces (D5, ADR-0110).
  CONTENT_HASH_KEY: ${CONTENT_HASH_KEY}
  OBSERVABILITY_CAPTURE_CONTENT: ${OBSERVABILITY_CAPTURE_CONTENT:-true}
  # Guard policies: presidio-analyzer with the Saudi recognizers (README §10.2).
  PRESIDIO_URL: http://presidio-analyzer:3000
  # Connections reserved for per-conversation turn locks (D6).
  LOCK_POOL_SIZE: ${LOCK_POOL_SIZE:-20}
  # The reranker, configured per environment (review round 2, finding 3): development off; a GPU
  # deployment on, with 16 candidates on 1070 characters. These override config/docs.yaml.
  RERANK_ENABLED: ${RERANK_ENABLED:-false}
  RERANK_CANDIDATES: ${RERANK_CANDIDATES:-16}
  RERANK_MAX_CHARS: ${RERANK_MAX_CHARS:-1070}
  # The uploads per user per minute the gateway applies over config/docs.yaml (GATEWAY_DOCS_UPLOADS_PER_MINUTE
  # below): the settings page shows it as that setting's default (ADR-0276).
  DOCS_UPLOADS_PER_MINUTE: ${UPLOADS_PER_MINUTE:-}
  # No MinIO credentials: the agent reads no upload; the ingest service does (S7, R4).

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # `mcp`: the internal network the reference MCP servers live on (phase 05, ADR-0211).
    networks: [default, mcp]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]

  redis:
    image: redis:7.4.11
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [default, mcp]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mc", "ready", "local"]

  # The only holder of MinIO's root credentials (owner decision S7): it makes the buckets, and one
  # user per service with a policy of its own; every service then uses its own user.
  #   gateway-uploads  writes, reads and discards uploads   (uploads-write)
  #   ingest-uploads   reads uploads                        (uploads-read)
  #   ragref-uploads   reads uploads (mcp-rag-ref, phase 05) (uploads-read)
  #   sweeper-uploads  lists uploads, removes an object     (uploads-sweep)
  #   langfuse-events  Langfuse's own bucket                (langfuse-bucket)
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_GATEWAY_ACCESS_KEY: ${MINIO_GATEWAY_ACCESS_KEY:?see .env.example}
      MINIO_GATEWAY_SECRET_KEY: ${MINIO_GATEWAY_SECRET_KEY:?see .env.example}
      MINIO_INGEST_ACCESS_KEY: ${MINIO_INGEST_ACCESS_KEY:?see .env.example}
      MINIO_INGEST_SECRET_KEY: ${MINIO_INGEST_SECRET_KEY:?see .env.example}
      MINIO_RAGREF_ACCESS_KEY: ${MINIO_RAGREF_ACCESS_KEY:?see .env.example}
      MINIO_RAGREF_SECRET_KEY: ${MINIO_RAGREF_SECRET_KEY:?see .env.example}
      MINIO_SWEEPER_ACCESS_KEY: ${MINIO_SWEEPER_ACCESS_KEY:?see .env.example}
      MINIO_SWEEPER_SECRET_KEY: ${MINIO_SWEEPER_SECRET_KEY:?see .env.example}
      MINIO_LANGFUSE_ACCESS_KEY: ${MINIO_LANGFUSE_ACCESS_KEY:?see .env.example}
      MINIO_LANGFUSE_SECRET_KEY: ${MINIO_LANGFUSE_SECRET_KEY:?see .env.example}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing local/uploads local/kb-docs local/langfuse;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::uploads"]},{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::uploads/*"]}]}' > /tmp/uploads-write.json;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::uploads"]},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::uploads/*"]}]}' > /tmp/uploads-read.json;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::uploads"]},{"Effect":"Allow","Action":["s3:DeleteObject"],"Resource":["arn:aws:s3:::uploads/*"]}]}' > /tmp/uploads-sweep.json;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::langfuse","arn:aws:s3:::langfuse/*"]}]}' > /tmp/langfuse-bucket.json;
        for policy in uploads-write uploads-read uploads-sweep langfuse-bucket; do
        mc admin policy create local "$$policy" "/tmp/$$policy.json"; done;
        mc admin user add local "$$MINIO_GATEWAY_ACCESS_KEY" "$$MINIO_GATEWAY_SECRET_KEY";
        mc admin user add local "$$MINIO_INGEST_ACCESS_KEY" "$$MINIO_INGEST_SECRET_KEY";
        mc admin user add local "$$MINIO_RAGREF_ACCESS_KEY" "$$MINIO_RAGREF_SECRET_KEY";
        mc admin user add local "$$MINIO_SWEEPER_ACCESS_KEY" "$$MINIO_SWEEPER_SECRET_KEY";
        mc admin user add local "$$MINIO_LANGFUSE_ACCESS_KEY" "$$MINIO_LANGFUSE_SECRET_KEY";
        attach() { mc admin policy attach local "$$1" --user "$$2" >/dev/null 2>&1 || mc admin user info local "$$2" | grep -q "$$1"; };
        attach uploads-write "$$MINIO_GATEWAY_ACCESS_KEY";
        attach uploads-read "$$MINIO_INGEST_ACCESS_KEY";
        attach uploads-read "$$MINIO_RAGREF_ACCESS_KEY";
        attach uploads-sweep "$$MINIO_SWEEPER_ACCESS_KEY";
        attach langfuse-bucket "$$MINIO_LANGFUSE_ACCESS_KEY";
        echo "minio: buckets, users and policies ready"
    restart: "no"

  # Pattern recognizers only (infra/presidio/recognizers.yaml); its NLP model is never asked for
  # an entity. One worker: each worker loads the spaCy model (~740 MiB).
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    environment:
      RECOGNIZER_REGISTRY_CONF_FILE: /srv/presidio/recognizers.yaml
      WORKERS: "1"
    volumes:
      - ./infra/presidio:/srv/presidio:ro
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]

  # ------------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Without a cap the JVM sizes its heap from the whole Docker VM.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Placeholders substituted into infra/keycloak/realm-export.json at import.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      KC_GATEWAY_CLIENT_SECRET: ${KC_GATEWAY_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3

  # ------------------------------------------------------------------ models
  litellm:
    image: ghcr.io/berriai/litellm:v1.100.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Which model serves each alias, and where (ADR-0066); defaults in .env.example.
      FAST_MODEL: ${FAST_MODEL:?set FAST_MODEL in .env, see .env.example}
      STANDARD_MODEL: ${STANDARD_MODEL:?set STANDARD_MODEL in .env, see .env.example}
      HEAVY_MODEL: ${HEAVY_MODEL:?set HEAVY_MODEL in .env, see .env.example}
      MODEL_API_BASE: ${MODEL_API_BASE:?set MODEL_API_BASE in .env, see .env.example}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:?set EMBED_MODEL in .env, see .env.example}
      EMBED_API_BASE: ${EMBED_API_BASE:?set EMBED_API_BASE in .env, see .env.example}
      # The reranker, like the embedder, named in .env (owner decision R1).
      RERANK_MODEL: ${RERANK_MODEL:?set RERANK_MODEL in .env, see .env.example}
      RERANK_API_BASE: ${RERANK_API_BASE:?set RERANK_API_BASE in .env, see .env.example}
      MODEL_REASONING_ENABLED: ${MODEL_REASONING_ENABLED:-false}
      MODEL_PROVIDER_ALLOW_FALLBACKS: ${MODEL_PROVIDER_ALLOW_FALLBACKS:-false}
      MODEL_PROVIDER_SORT: ${MODEL_PROVIDER_SORT:-throughput}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    # Loopback only, behind the master key: `make eval` scores Ragas metrics through the judge
    # role's alias from the host (ADR-0141).
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, mcp]   # mcp-rag-ref embeds through it (phase 05)
    # No dependency on `rerank`: the stack starts without the reranker's weights (owner decision R1).
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]

  # Cross-encoder reranker bge-reranker-v2-m3 behind the LiteLLM `rerank` alias (ADR-0134). The
  # weights come from the external volume `make models` fills (pinned revision, ADR-0179); nothing
  # is downloaded at start. Without weights it idles and says what to run, so `make up` never
  # depends on `make models` (owner decision R1); retrieval then cannot rerank until they exist.
  rerank:
    image: michaelf34/infinity:0.0.75
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -s /models/bge-reranker-v2-m3/model.safetensors ]; then
        exec infinity_emb v2 --model-id /models/bge-reranker-v2-m3 --served-model-name bge-reranker-v2-m3
        --engine torch --device cpu --batch-size 16 --port 7997 --no-bettertransformer; fi;
        echo "reranker weights not found in volume rerank-models: run 'make models'
        (or set retrieval.rerank.enabled: false in config/docs.yaml)";
        exec sleep infinity
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      INFINITY_ANONYMOUS_USAGE_STATS: "0"
    volumes:
      - rerank-models:/models:ro
    healthcheck:
      <<: *healthcheck
      start_period: 120s
      # Healthy when serving, or when idle for want of weights (the message above is in its log).
      test: ["CMD-SHELL", "test ! -s /models/bge-reranker-v2-m3/model.safetensors || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health')\""]

  # ------------------------------------------------------------------ observability
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]

  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3030/api/health || exit 1"]

  langfuse-web:
    image: langfuse/langfuse:3.225.7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    ports:
      - "${LANGFUSE_PORT}:3000"
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    # Distroless image: no shell for a healthcheck. The health_check extension
    # listens on :13133 for external probes.
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      langfuse-web:
        condition: service_healthy

  # ------------------------------------------------------------------ application
  agent:
    build:
      context: ./services/agent
      target: runtime
    environment:
      <<: *agent-env
      LITELLM_BASE_URL: http://litellm:4000
      # State, owners and memory in database `app`, schema `agent` (ADR-0055).
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@postgres:5432/app
      DEBUG_CONTEXT_ENABLED: ${DEBUG_CONTEXT_ENABLED:-false}
      DEBUG_CONTEXT_RETENTION_DAYS: ${DEBUG_CONTEXT_RETENTION_DAYS:-7}
      # Policy cache, change notifications and judge verdicts (README §10.1).
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: agent
      # MCP (phase 05): the servers of config/mcp.yaml by URL, the RAG server's token, the
      # profile this deployment runs and the external-server gate (D5, I16, ADR-0204). The agent
      # does not wait for any server: one that is down is reported, never fatal (I8).
      MCP_ROUTING_URL: ${MCP_ROUTING_URL:-http://mcp-routing-ref:8000/mcp}
      MCP_RAG_URL: ${MCP_RAG_URL:-http://mcp-rag-ref:8000/mcp}
      MCP_RAG_TOKEN: ${MCP_RAG_TOKEN:?see .env.example}
      MCP_PROFILE: ${MCP_PROFILE:-default}
      MCP_ALLOW_EXTERNAL: ${MCP_ALLOW_EXTERNAL:-false}
      # The document backend of uploads and the docs capability: empty keeps config/docs.yaml (I11).
      DOCS_BACKEND: ${DOCS_BACKEND:-}
    volumes:
      - ./config:/srv/config:ro
      - ./skills:/srv/skills:ro
    networks: [default, mcp, mcp-routing]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]

  # ------------------------------------------------------------------ reference MCP servers (phase 05)
  # Each in its own container on `mcp`, an internal network with no route out, never published to
  # the host (I10, ADR-0211). The agent reaches them through its MCP client, behind the broker.
  # MCP_REF_TEST_DELAY_S and MCP_REF_TEST_OVERSIZE_BYTES are test-only switches, off here.
  mcp-routing-ref:
    build:
      context: ./infra/mcp-ref
      additional_contexts:
        agent: ./services/agent
    command: ["python", "-m", "mcp_ref.routing"]
    environment:
      # The test-only switch (I10): off unless smoke's hung-server step sets it for one recreate.
      MCP_REF_TEST_DELAY_S: ${MCP_REF_TEST_DELAY_S:-0}
    # Least privilege (ADR-0242): a network it shares with the agent only, no postgres, minio or litellm.
    networks: [mcp-routing]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  # The reference RAG server: the phase 04 pipeline over MCP, its own schema (rag_ref), database role
  # and MinIO user (read uploads only); files parsed in limited child processes (ADR-0176).
  mcp-rag-ref:
    build:
      context: ./infra/mcp-ref
      additional_contexts:
        agent: ./services/agent
    command: ["python", "-m", "mcp_ref.rag"]
    # As ingest: the same sandbox limits from config/docs.yaml, checked at startup, no swap (I7).
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      CONFIG_DIR: /srv/config
      DATABASE_URL: postgresql://rag_ref:${RAG_REF_DB_PASSWORD}@postgres:5432/app
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_RAGREF_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_RAGREF_SECRET_KEY}
      MCP_RAG_TOKEN: ${MCP_RAG_TOKEN:?see .env.example}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-16}
      RERANK_MAX_CHARS: ${RERANK_MAX_CHARS:-1070}
    volumes:
      - ./config:/srv/config:ro
    networks: [mcp]
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  # Database roles a new volume's init scripts cannot create on an existing one: the reference RAG
  # server's role and schema, and CONNECT kept from PUBLIC (infra/postgres/roles, ADR-0242).
  # Idempotent, on every `make up` and `make test-agent`.
  postgres-roles:
    image: pgvector/pgvector:0.8.6-pg16
    entrypoint: ["bash", "-c", "bash /roles/rag-ref.sh && bash /roles/connect.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RAG_REF_DB_PASSWORD: ${RAG_REF_DB_PASSWORD:?see .env.example}
    volumes:
      - ./infra/postgres/roles:/roles:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Ingestion out of the agent's process (owner decision R4): the agent's image in a container of
  # its own with a hard memory limit; each file is parsed in a child process with CPU, memory and
  # time limits (config/docs.yaml ingest.sandbox). It also runs the orphan sweeper (S4).
  ingest:
    build:
      context: ./services/agent
      target: runtime
    command: ["python", "-m", "app.rag.ingest.service"]
    # workers × the sandbox child's limit + the service's reserve must fit (config/docs.yaml,
    # checked at startup); no swap, so the limit is the one the check reads (I7, ADR-0252).
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      CONFIG_DIR: /srv/config
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Its own MinIO users (owner decision S7): read uploads; list and remove orphans.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_INGEST_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_INGEST_SECRET_KEY}
      MINIO_SWEEPER_ACCESS_KEY: ${MINIO_SWEEPER_ACCESS_KEY}
      MINIO_SWEEPER_SECRET_KEY: ${MINIO_SWEEPER_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ingest
    volumes:
      - ./config:/srv/config:ro
    depends_on:
      agent:
        condition: service_healthy   # the agent applies the database migrations
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 3)"]

  gateway:
    build:
      context: ./services/gateway
    # The JVM takes 75% of this limit as max heap (Dockerfile ENTRYPOINT).
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      GATEWAY_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KC_REALM}
      GATEWAY_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      GATEWAY_KEYCLOAK_AUDIENCE: ${KC_GATEWAY_CLIENT_ID}
      # Admin REST API with the gateway client's service account: lists policy:* roles (ADR-0107).
      GATEWAY_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      GATEWAY_KEYCLOAK_ADMIN_REALM: ${KC_REALM}
      GATEWAY_KEYCLOAK_ADMIN_CLIENT_ID: ${KC_GATEWAY_CLIENT_ID}
      GATEWAY_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_GATEWAY_CLIENT_SECRET}
      GATEWAY_AGENT_BASE_URL: http://agent:8000
      GATEWAY_AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${WEB_PUBLIC_URL}
      GATEWAY_MODELS_CONFIG: /srv/config/models.yaml
      # Upload limits (ADR-0126) and the uploads bucket (ADR-0129).
      GATEWAY_DOCS_CONFIG: /srv/config/docs.yaml
      GATEWAY_TURN_CONFIG: /srv/config/turn.yaml
      # The per-user upload rate, per environment (review round 2, finding 4): .env.example sets the
      # development value. No fallback value here: absent from .env, the variable is empty and the
      # gateway uses config/docs.yaml's baseline (20), the strict one (the verification of round 2).
      GATEWAY_DOCS_UPLOADS_PER_MINUTE: ${UPLOADS_PER_MINUTE:-}
      GATEWAY_STORAGE_ENDPOINT: http://minio:9000
      # Its own MinIO user (owner decision S7): write, read and discard uploads.
      GATEWAY_STORAGE_ACCESS_KEY: ${MINIO_GATEWAY_ACCESS_KEY}
      GATEWAY_STORAGE_SECRET_KEY: ${MINIO_GATEWAY_SECRET_KEY}
      GATEWAY_STORAGE_BUCKET: uploads
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      - ./config/models.yaml:/srv/config/models.yaml:ro   # role tier caps (ADR-0046)
      - ./config/docs.yaml:/srv/config/docs.yaml:ro       # upload limits (ADR-0126)
      - ./config/turn.yaml:/srv/config/turn.yaml:ro       # the relay's bound on a turn (ADR-0256)
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      agent:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]

  web:
    build:
      context: ./services/web
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KC_REALM: ${KC_REALM}
      KC_WEB_CLIENT_ID: ${KC_WEB_CLIENT_ID}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]

  # ------------------------------------------------------------------ test profile (make test)
  # Deterministic embeddings and rerank scores for `make test` (ADR-0143); never in the real stack.
  embed-mock:
    profiles: [test]
    build:
      context: ./services/agent
      target: test
      additional_contexts:
        mcpref: ./infra/mcp-ref
    command: ["uvicorn", "tests.fixtures.embed_service:app", "--host", "0.0.0.0", "--port", "8000"]
    # Only litellm-mock reaches it: a test network of its own, with no route out (owner decision S6).
    networks: [test]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  litellm-mock:
    profiles: [test]
    image: ghcr.io/berriai/litellm:v1.100.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./infra/litellm/config.mock.yaml:/app/config.yaml:ro
    # Loopback only (owner decision S6): local pytest runs reach it on 127.0.0.1:4001.
    ports:
      - "127.0.0.1:4001:4000"
    networks: [default, test]
    depends_on:
      embed-mock:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]

  agent-tests:
    profiles: [test]
    build:
      context: ./services/agent
      target: test
      additional_contexts:
        mcpref: ./infra/mcp-ref
    environment:
      <<: *agent-env
      LITELLM_BASE_URL: http://litellm-mock:4000
      DOCS_DIR: /srv/docs
      # The test database from infra/postgres/init, as the app role; never the superuser (ADR-0070).
      AGENT_TEST_DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@postgres:5432/agent_test
      # The reference RAG server under test runs as its own role on its own database (ADR-0242).
      RAG_REF_TEST_DATABASE_URL: postgresql://rag_ref:${RAG_REF_DB_PASSWORD}@postgres:5432/rag_ref_test
      # Redis database 15 and a namespace of its own: tests never meet the stack's keys or channels.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/15
      # Tests store uploads as the gateway does, and sweep as the ingest service does (S7).
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_GATEWAY_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_GATEWAY_SECRET_KEY}
      MINIO_SWEEPER_ACCESS_KEY: ${MINIO_SWEEPER_ACCESS_KEY}
      MINIO_SWEEPER_SECRET_KEY: ${MINIO_SWEEPER_SECRET_KEY}
    volumes:
      - ./config:/srv/config:ro
      - ./skills:/srv/skills:ro
      - ./docs:/srv/docs:ro   # contract drift test (ADR-0044)
      - ./infra/keycloak:/srv/infra/keycloak:ro   # no realm user is in a tenant to serve a policy (ADR-0107)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      litellm-mock:
        condition: service_healthy
      minio:
        condition: service_healthy

  # JDBC tests of the gateway against this Postgres; an image build cannot reach it (ADR-0051).
  gateway-db-tests:
    profiles: [test]
    build:
      context: ./services/gateway
      target: db-test
    environment:
      GATEWAY_TEST_DB_URL: jdbc:postgresql://postgres:5432/
      GATEWAY_TEST_DB_USER: postgres
      GATEWAY_TEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gateway-gradle-cache:/home/gradle/.gradle
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default: {}
  # The deterministic embed and rerank service of `make test` (ADR-0143) and its one client.
  test:
    internal: true
  # The reference MCP servers and what they reach (phase 05, ADR-0211): no route out.
  mcp:
    internal: true
  # The reference routing server and its one client, the agent (ADR-0242): no route out.
  mcp-routing:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  clickhouse-data:
  clickhouse-logs:
  gateway-gradle-cache:
    name: gateway-gradle-cache   # shared with `make openapi`
  rerank-models:
    name: rerank-models          # filled by `make models` (ADR-0134); external, so `make clean` keeps it (R1)
    external: true
