# v1 stack (README §14). Every value comes from .env (`make env`); no secrets here.
name: agent-platform

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

x-langfuse-env: &langfuse-env
  # Next.js binds to $HOSTNAME, which Docker sets to the container id.
  HOSTNAME: "0.0.0.0"
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  REDIS_TLS_ENABLED: "false"

x-agent-env: &agent-env
  LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
  AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
  CONFIG_DIR: /srv/config
  USER_ID_HASH_SALT: ${USER_ID_HASH_SALT}
  OBSERVABILITY_CAPTURE_CONTENT: ${OBSERVABILITY_CAPTURE_CONTENT:-true}

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]

  redis:
    image: redis:7.4.11
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mc", "ready", "local"]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/uploads local/kb-docs local/langfuse
    restart: "no"

  # ------------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Without a cap the JVM sizes its heap from the whole Docker VM.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Placeholders substituted into infra/keycloak/realm-export.json at import.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      KC_GATEWAY_CLIENT_SECRET: ${KC_GATEWAY_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3

  # ------------------------------------------------------------------ models
  litellm:
    image: ghcr.io/berriai/litellm:v1.100.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]

  # ------------------------------------------------------------------ observability
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]

  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3030/api/health || exit 1"]

  langfuse-web:
    image: langfuse/langfuse:3.225.7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    ports:
      - "${LANGFUSE_PORT}:3000"
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    # Distroless image: no shell for a healthcheck. The health_check extension
    # listens on :13133 for external probes.
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      langfuse-web:
        condition: service_healthy

  # ------------------------------------------------------------------ application
  agent:
    build:
      context: ./services/agent
      target: runtime
    environment:
      <<: *agent-env
      LITELLM_BASE_URL: http://litellm:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: agent
    volumes:
      - ./config:/srv/config:ro
    depends_on:
      litellm:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]

  gateway:
    build:
      context: ./services/gateway
    # The JVM takes 75% of this limit as max heap (Dockerfile ENTRYPOINT).
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      GATEWAY_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KC_REALM}
      GATEWAY_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      GATEWAY_KEYCLOAK_AUDIENCE: ${KC_GATEWAY_CLIENT_ID}
      GATEWAY_AGENT_BASE_URL: http://agent:8000
      GATEWAY_AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${WEB_PUBLIC_URL}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]

  web:
    build:
      context: ./services/web
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KC_REALM: ${KC_REALM}
      KC_WEB_CLIENT_ID: ${KC_WEB_CLIENT_ID}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]

  # ------------------------------------------------------------------ test profile (make test)
  litellm-mock:
    profiles: [test]
    image: ghcr.io/berriai/litellm:v1.100.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./infra/litellm/config.mock.yaml:/app/config.yaml:ro
    ports:
      - "4001:4000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]

  agent-tests:
    profiles: [test]
    build:
      context: ./services/agent
      target: test
    environment:
      <<: *agent-env
      LITELLM_BASE_URL: http://litellm-mock:4000
      DOCS_DIR: /srv/docs
    volumes:
      - ./config:/srv/config:ro
      - ./docs:/srv/docs:ro   # contract drift test (ADR-0044)
    depends_on:
      litellm-mock:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  clickhouse-data:
  clickhouse-logs:
